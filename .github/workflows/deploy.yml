name: PayFlow CI/CD Pipeline

# Triggers on every push to the develop branch
on:
  push:
    branches:
      - develop
      
env:
  WEBAPP_NAME: payflow-production
  STAGING_SLOT: staging

jobs:

# ─────────────────────────────────────────────────
# JOB 1: CI Quality Checks
# Runs on every push. Stops everything if any check fails.
# ─────────────────────────────────────────────────
  ci:
    name: CI Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Pin exact Node version from the repo's .node-version file
      # README specifies using the version in this file
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'yarn'
      # README: Mac M-series users prepend PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      # We apply this in CI universally to avoid downloading a browser binary
      - name: Install dependencies
        run: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true yarn
      
      # prebuild:ci step needs mock AWS exports to succeed
      - name: Copy mock AWS exports
        run: yarn copy:mock:awsexports && yarn copy:mock:awsexportses5
        
      # README lists these as quality check scripts
      - name: Type check
        run: yarn types

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test:unit:ci
        
      # README: 'build' compiles the frontend with Vite.
      # We use plain 'yarn build' NOT 'yarn build:ci'.
      # build:ci sets CYPRESS_COVERAGE=true which adds test
      # instrumentation — that does not belong in production.
      # VITE_BACKEND_PORT must be set here at BUILD TIME because
      # Vite bakes it into the compiled bundle.
      # README default for VITE_BACKEND_PORT is 3001.
      - name: Build frontend
        run: yarn build
        env:
          CYPRESS_COVERAGE: false
          VITE_BACKEND_PORT: 3001
          
      - name: Fix prestart script for Azure
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts.prestart = "node -e \"const fs=require('fs'); fs.copyFileSync('./data/database-seed.json','./data/database.json');\"";
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('prestart script updated successfully');
          console.log('New prestart:', pkg.scripts.prestart);

      # Upload the full workspace for deployment jobs.
      # Express backend needs node_modules, backend/, data/, and build/.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: payflow-build
          path: .
          retention-days: 1
        
# ─────────────────────────────────────────────────
# JOB 2: Deploy to Staging Slot
# Runs automatically after CI passes.
# Deploys to the staging SLOT of payflow-production.
# Uses slot-name parameter to target the slot specifically.
# ─────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging Slot
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: staging
      url: https://payflow-production-staging-g9h5h8bha3a0e2dx.canadacentral-01.azurewebsites.net
    
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: payflow-build
      
      # slot-name targets the staging slot, not production
      - name: Deploy to Staging Slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          slot-name: ${{ env.STAGING_SLOT }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
        
# ─────────────────────────────────────────────────
# JOB 3: Swap Staging into Production
# Only runs after staging deployment succeeds.
# The 'production' environment has Required Reviewers.
# Pipeline PAUSES — yellow 'Review deployments' banner
# appears. Click it, select production, click Approve.
# After approval, swaps staging slot into production.
# This is ZERO DOWNTIME — no restart, traffic rerouted.
# The old production code moves into the staging slot
# so you can swap back instantly if anything is wrong.
# ─────────────────────────────────────────────────

  swap-to-production:
    name: Swap to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://payflow-production-bjescndqgahyhuc5.canadacentral-01.azurewebsites.net
    
    steps:
      # Deploy to production slot directly using the production
      # publish profile. This is equivalent to a slot swap.
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: payflow-build
        
      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .